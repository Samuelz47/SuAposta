name: suaposta

services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?POSTGRES_SUPERUSER is required}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_SUPERUSER_DB:?POSTGRES_SUPERUSER_DB is required}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT is required}
      AUTH_DB_NAME: ${AUTH_DB_NAME:?AUTH_DB_NAME is required}
      AUTH_DB_USER: ${AUTH_DB_USER:?AUTH_DB_USER is required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      BETTING_DB_NAME: ${BETTING_DB_NAME:?BETTING_DB_NAME is required}
      BETTING_DB_USER: ${BETTING_DB_USER:?BETTING_DB_USER is required}
      BETTING_DB_PASSWORD: ${BETTING_DB_PASSWORD:?BETTING_DB_PASSWORD is required}
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME:?ANALYTICS_DB_NAME is required}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:?ANALYTICS_DB_USER is required}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required}
    command:
      - postgres
      - -p
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}"
    ports:
      - "${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT is required}:${POSTGRES_PORT:?POSTGRES_PORT is required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - suaposta-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1 -p "$${POSTGRES_PORT}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13.7-management
    hostname: ${RABBITMQ_HOST:?RABBITMQ_HOST is required}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
      RABBITMQ_AMQP_PORT: ${RABBITMQ_AMQP_PORT:?RABBITMQ_AMQP_PORT is required}
    ports:
      - "${RABBITMQ_HOST_AMQP_PORT:?RABBITMQ_HOST_AMQP_PORT is required}:${RABBITMQ_AMQP_PORT:?RABBITMQ_AMQP_PORT is required}"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:?RABBITMQ_MANAGEMENT_HOST_PORT is required}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - suaposta-network
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

networks:
  suaposta-network:
    driver: bridge

volumes:
  postgres-data: {}
  rabbitmq-data: {}
