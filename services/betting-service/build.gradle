// Betting Service persistence and API foundation.

dependencies {
    implementation project(':libs:messaging-contract')
    implementation 'org.springframework.boot:spring-boot-starter-actuator:3.4.5'
    implementation 'org.springframework.boot:spring-boot-starter-amqp:3.4.5'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.4.5'
    implementation 'org.springframework.boot:spring-boot-starter-web:3.4.5'
    implementation 'org.flywaydb:flyway-core:10.20.1'
    implementation 'org.flywaydb:flyway-database-postgresql:10.20.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.4.5'
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:3.4.5')
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    testImplementation 'com.rabbitmq:amqp-client'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-rabbitmq'
    runtimeOnly 'org.postgresql:postgresql:42.7.5'
}
